name: 报告 Flutter 官方插件的 Bug
description: |
  在 Flutter 的某个官方插件中发现了 Bug。
labels: ['triage', 'bug', 'plugin']
body:
  - type: markdown
    attributes:
      value: |
        感谢使用 Flutter！

        如需帮助，请查阅文档或在 Stack Overflow 上提问：

          - https://flutter.dev/
          - https://api.flutter.dev/
          - https://stackoverflow.com/questions/tagged/flutter?sort=frequent
  - type: markdown
    attributes:
      value: |
        填写表单前，请确认以下事项：
        - 已搜索[已有的插件 Issue](https://gitcode.com/CPF-Flutter/flutter_packages/issues)
        - 已阅读[提交 Bug 指南](https://docs.flutter.dev/resources/bug-reports)
  - type: dropdown
    id: packages
    attributes:
      label: 此 Bug 报告属于哪个插件？
      description: |
        如果遇到问题的插件不在列表中，可能是第三方插件。
        此情况请直接向该插件的开发者反馈。
      options:
        - animations
        - camera
        - cross_file
        - espresso
        - extension_google_sign_in_as_googleapis_auth
        - file_selector
        - flutter_lints
        - flutter_migrate
        - flutter_plugin_android_lifecycle
        - flutter_svg
        - flutter_template_images
        - go_router
        - go_router_builder
        - google_adsense
        - google_fonts
        - google_identity_services_web
        - google_maps_flutter
        - google_sign_in
        - image_picker
        - in_app_purchase
        - interactive_media_ads
        - local_auth
        - metrics_center
        - multicast_dns
        - path_parsing
        - path_provider
        - pigeon
        - plugin_platform_interface
        - pointer_interceptor
        - process
        - quick_actions
        - rfw
        - shared_preferences
        - standard_message_codec
        - two_dimensional_scrollables
        - url_launcher
        - vector_graphics
        - video_player
        - web_benchmarks
        - webview_flutter
        - xdg_directories
    validations:
      required: true
  - type: dropdown
    id: target_platforms
    attributes:
      label: 在哪些目标平台上出现了此问题？
      description: 请确认该插件是否支持你报告的目标平台。
      multiple: true
      options:
        - OHOS
        - Android
        - iOS
        - Web
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: dropdown
    id: pub_upgrade
    attributes:
      label: 是否已升级插件版本？
      description: |
        请运行 `flutter pub upgrade` 后检查问题是否仍然存在。
      options:
        - "是"
        - "否"
    validations:
      required: true
  - type: textarea
    attributes:
      label: 依赖版本
      description: |
        请提供包含该插件及其依赖项的 `pubspec.lock` 文件内容。

        如有敏感信息，可移除文件中的私有依赖。

        如果文件过大或内容过长，可使用 https://pastebin.com 等在线工具分享链接。

        注意：请勿上传文本截图，请使用代码块或上述方式提供内容。
      value: |
        <details><summary>pubspec.lock</summary>

        ```lock
        [在此粘贴文件内容]
        ```

        </details>
  - type: textarea
    attributes:
      label: 复现步骤
      description: 请详细描述如何复现你遇到的问题。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: 期望结果
      description: 请描述期望发生的行为。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实际结果
      description: 请描述实际发生了什么。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 代码示例
      description: |
        请创建一个最小可复现示例来展示问题，并在下方代码块中粘贴。

        可使用 `flutter create bug` 命令创建项目并修改 `main.dart` 文件。

        也可以创建公开的 GitCode 仓库来分享示例。

        缺少此示例将很难推进问题排查，我们可能不得不关闭此 Issue。

        如果该插件的示例项目足够简单，也可以直接参考它来复现 Bug。

        注意：请勿上传文本截图，请使用代码块或上述方式提供代码。
      value: |
        <details open><summary>代码示例</summary>

        ```dart
        [在此粘贴代码]
        ```

        </details>
    validations:
      required: true
  - type: textarea
    attributes:
      label: 截图或视频
      description: |
        如有，请上传 Bug 相关的截图或视频。
      value: |
        <details open>
        <summary>截图 / 视频演示</summary>

        [在此上传媒体文件]

        </details>
  - type: textarea
    attributes:
      label: 日志
      description: |
        请在下方代码块中粘贴所运行命令的完整日志。如果运行了 `flutter` 命令，请附上添加 `--verbose` 参数后的输出，例如 `flutter --verbose create foo` 的输出。

        如果日志过大无法上传到 GitCode，可以将其保存为 `txt` 文件，或使用 https://pastebin.com 等在线工具分享。

        注意：请勿上传文本截图，请使用代码块或上述方式提供日志。
      value: |
        <details open><summary>日志</summary>

        ```console
        [在此粘贴日志]
        ```

        </details>
  - type: textarea
    attributes:
      label: Flutter Doctor 输出
      description: |
        请提供 `flutter doctor -v` 的完整输出
      value: |
        <details open><summary>Doctor 输出</summary>

        ```console
        [在此粘贴输出]
        ```

        </details>
    validations:
      required: true
