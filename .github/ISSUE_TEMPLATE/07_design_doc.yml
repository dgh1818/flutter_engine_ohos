name: 分享 Flutter 设计文档
description: 作为贡献者，分享一个设计文档。
labels: ['design doc', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        感谢你有兴趣为 Flutter 做贡献！

        分享设计文档时，请遵循
        https://github.com/flutter/flutter/blob/main/docs/contributing/Design-Documents.md
        中的指引。

        请尽量完整填写以下各部分。
  - type: input
    id: document_link
    attributes:
      label: 文档链接
      description: |
        请填入文档的 "https://flutter.dev/go" 链接。
        关于如何创建链接，请参阅
        https://flutter.dev/go/template 中的说明。
    validations:
      required: true
  - type: textarea
    id: proposal_description
    attributes:
      label: 你要解决什么问题？
      description: |
        请简要描述你要解决的问题。
    validations:
      required: true
