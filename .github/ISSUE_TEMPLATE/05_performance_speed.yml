name: 应用运行缓慢或丢帧
description: |
  开发应用时发现运行缓慢、无法达到 60Hz，
  或出现卡顿（丢帧）。
labels: ['performance', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        感谢使用 Flutter！

        如需帮助，请查阅文档或在 Stack Overflow 上提问：

          - https://flutter.dev/
          - https://api.flutter.dev/
          - https://stackoverflow.com/questions/tagged/flutter?sort=frequent
  - type: textarea
    attributes:
      label: 复现步骤
      description: 请详细描述如何复现你遇到的问题。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: 代码示例
      description: |
        请创建一个最小可复现示例来展示问题，并在下方代码块中粘贴。

        请尝试在测试应用中复现问题：运行 `flutter create janktest` 并在其中重现你遇到的情况，或克隆你的应用并逐步删减代码，直到卡顿问题可以通过单个 `.dart` 文件复现。

        如果仅靠 `.dart` 文件无法复现（例如需要资源文件或插件），请创建 GitCode 仓库并上传代码。

        缺少此示例将很难推进问题排查，我们可能不得不关闭此 Issue。

        注意：请勿上传文本截图，请使用代码块或上述方式提供代码。
      value: |
        <details open><summary>代码示例</summary>

        ```dart
        [在此粘贴代码]
        ```

        </details>
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: 在 master 渠道上进行性能分析
      description: |
        将 Flutter 切换到 master 渠道，在真机上以 profile 模式并启用 Skia tracing 运行应用：
        ```console
        flutter channel master
        flutter run --profile --trace-skia
        ```
        建议使用最新的 master 渠道，因为 Flutter 会持续修复 Bug 并优化性能。旧版本中的问题可能已在 master 渠道中修复。
      options:
      - label: 该问题在 master 渠道上仍然存在
        required: true
  - type: textarea
    attributes:
      label: 时间线追踪
      description: |
        打开 Flutter DevTools，保存性能问题的时间线追踪，以便我们定位可能导致问题的函数。请参阅博客文章中的"如何收集和阅读时间线追踪"：https://medium.com/flutter/profiling-flutter-applications-using-the-timeline-a1a434964af3#a499

        录制追踪时请确保关闭性能覆盖层，因为它可能影响 profile 运行的性能。（在命令行按 'P' 键可切换覆盖层。）

        如果追踪文件过大无法上传到 GitCode，可以将其保存为 `zip` 文件，或使用 https://pastebin.com 等在线工具分享。
      value: |
        <details open><summary>时间线追踪 JSON</summary>

        ```json
        [在此粘贴时间线追踪]
        ```

        </details>
    validations:
      required: true
  - type: textarea
    attributes:
      label: 视频演示
      description: |
        请用另一部手机录制性能问题的视频，以便我们直观了解发生了什么。

        
      value: |
        <details open>
        <summary>视频演示</summary>

        [在此上传媒体文件]

        </details>
  - type: dropdown
    id: target_platforms
    attributes:
      label: 在哪些目标平台上出现了此问题？
      multiple: true
      options:
        - OHOS
        - Android
        - iOS
        - Web
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: textarea
    attributes:
      label: 操作系统/浏览器名称及版本 | 设备信息
      description: |
        测试系统运行的目标操作系统版本是什么？Web 平台请提供浏览器版本。
        请同时提供设备信息（型号、CPU 架构等）。
    validations:
      required: true
  - type: dropdown
    id: device-kind
    attributes:
      label: 该问题在模拟器和真机上都会出现吗？
      options:
        - "不确定"
        - "是"
        - "否"
    validations:
      required: true
  - type: dropdown
    id: enable-impeller
    attributes:
      label: 该问题是否仅在 Impeller 下可复现？
      description: |
        请参阅 https://docs.flutter.dev/perf/impender 了解如何启用/禁用 Impeller。
      options:
        - "不适用"
        - "是"
        - "否"
    validations:
      required: true
  - type: textarea
    attributes:
      label: 日志
      description: |
        请在下方代码块中粘贴所运行命令的完整日志。如果运行了 `flutter` 命令，请附上添加 `--verbose` 参数后的输出，例如 `flutter --verbose create foo` 的输出。

        如果日志过大无法上传到 GitCode，可以将其保存为 `txt` 文件，或使用 https://pastebin.com 等在线工具分享。

        注意：请勿上传文本截图，请使用代码块或上述方式提供日志。
      value: |
        <details open><summary>日志</summary>

        ```console
        [在此粘贴日志]
        ```

        </details>
  - type: textarea
    attributes:
      label: Flutter Doctor 输出
      description: |
        最后，请在连接设备的情况下粘贴 `flutter doctor -v` 的输出。
      value: |
        <details open><summary>Doctor 输出</summary>

        ```console
        [在此粘贴输出]
        ```

        </details>
    validations:
      required: true
